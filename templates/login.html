<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Suporte Técnico - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <h2 class="text-center mb-4">💻 HelpDesk Acadêmico</h2>
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }} text-center" role="alert">{{ message }}</div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <div class="card p-4 shadow-sm">
                    <ul class="nav nav-pills mb-3 justify-content-center" id="pills-tab" role="tablist">
                        <li class="nav-item"><button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-form" type="button">Entrar</button></li>
                        <li class="nav-item"><button class="nav-link" id="cadastro-tab" data-bs-toggle="pill" data-bs-target="#cadastro-form" type="button">Cadastrar-se</button></li>
                    </ul>
                    
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="login-form">
                            <form action="/login" method="POST" id="formLogin">
                                <div class="mb-3">
                                    <label class="form-label">Usuário</label>
                                    <input type="text" name="username" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Senha</label>
                                    <input type="password" name="password" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Acessar</button>
                            </form>
                        </div>
                        
                        <div class="tab-pane fade" id="cadastro-form">
                            <form action="/cadastro" method="POST" id="formCadastro">
                                <div class="mb-3">
                                    <label class="form-label">Escolha um Usuário</label>
                                    <input type="text" name="username" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Senha (Mínimo 6 caracteres)</label>
                                    <input type="password" name="password" id="senhaCadastro" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-success w-100">Criar Conta</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
