<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Suporte Técnico - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100">
        <div class="col-md-5 w-100" style="max-width: 440px;">
            <div class="text-center mb-4">
                <h2 class="fw-bold tracking-tight">HelpDesk Acadêmico</h2>
                <p class="text-muted">Gerenciamento seguro de chamados institucionais</p>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }} text-center shadow-sm" role="alert">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <div class="card p-4 shadow-sm border-0">
                <ul class="nav nav-pills mb-4 justify-content-center" id="pills-tab" role="tablist">
                    <li class="nav-item flex-fill text-center"><button class="nav-link active w-100" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-form" type="button">Entrar</button></li>
                    <li class="nav-item flex-fill text-center"><button class="nav-link w-100" id="cadastro-tab" data-bs-toggle="pill" data-bs-target="#cadastro-form" type="button">Cadastrar-se</button></li>
                </ul>
                
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="login-form">
                        <form action="/login" method="POST" id="formLogin">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Usuário</label>
                                <input type="text" name="username" class="form-control" placeholder="Seu identificador" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-semibold text-secondary">Senha</label>
                                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Acessar o Painel</button>
                        </form>
                    </div>
                    
                    <div class="tab-pane fade" id="cadastro-form">
                        <form action="/cadastro" method="POST" id="formCadastro">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Escolha um Usuário</label>
                                <input type="text" name="username" class="form-control" placeholder="Ex: nome.sobrenome" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-semibold text-secondary">Senha (Mínimo 8 caracteres)</label>
                                <input type="password" name="password" id="senhaCadastro" class="form-control" placeholder="Crie uma senha forte" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2">Criar Minha Conta</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const alerta = document.querySelector('.alert');
            if (alerta) {
                if (alerta.classList.contains('alert-danger') || alerta.classList.contains('alert-warning')) {
                    if (alerta.textContent.includes('horrorosa') || alerta.textContent.includes('existe') || alerta.textContent.includes('branco')) {
                        const cadastroTab = document.getElementById('cadastro-tab');
                        if (cadastroTab) {
                            bootstrap.Tab.getOrCreateInstance(cadastroTab).show();
                        }
                    } else {
                        const loginTab = document.getElementById('login-tab');
                        if (loginTab) {
                            bootstrap.Tab.getOrCreateInstance(loginTab).show();
                        }
                    }
                } else if (alerta.classList.contains('alert-success')) {
                    const loginTab = document.getElementById('login-tab');
                    if (loginTab) {
                        bootstrap.Tab.getOrCreateInstance(loginTab).show();
                    }
                }
            }
        });
    </script>
</body>
</html>
